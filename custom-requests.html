<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Requests | Offbeat Admin</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1100px;margin:auto;padding:45px 20px 100px}h1{font-size:60px}.request{padding:25px;margin:18px 0;background:#24201c;border:1px solid #795337;border-radius:12px}.request p{overflow-wrap:anywhere;white-space:pre-wrap}.request button{margin:5px}.muted{color:#d4bda7}#status{margin:20px 0}input{padding:12px}a{color:#ffa464}</style></head><body><header class="top"><a href="/"><img class="nav-logo" src="/assets/offbeat-logo.webp" alt="Offbeat"></a><nav><a href="/order-dashboard.html">ORDER DASHBOARD</a><a href="/shop-categories.html">SHOP</a></nav></header><main><p class="eyebrow">OFFBEAT ADMIN</p><h1>CUSTOM REQUESTS</h1><p class="muted">Private artwork and customer requests. Admin sign-in required. No payments are collected here.</p><p id="status">Checking administrator session...</p><button class="btn" id="refresh">REFRESH REQUESTS</button><div id="requests"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://stkhsfxtmeeiepxnzgym.supabase.co','sb_publishable_FKxLA2wuSeEauCYWFx3vJA_mjJ7Az6X');const root=document.getElementById('requests'),status=document.getElementById('status');
async function call(body){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in through the order dashboard first, then return here.');const response=await fetch('https://stkhsfxtmeeiepxnzgym.supabase.co/functions/v1/offbeat-admin-requests',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_FKxLA2wuSeEauCYWFx3vJA_mjJ7Az6X'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
const element=(tag,value)=>{const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e};
async function load(){root.replaceChildren();status.textContent='Loading...';try{const data=await call({action:'list'});status.textContent=data.requests.length+' recent requests';for(const r of data.requests){const box=element('article');box.className='request';box.append(element('h2',r.kind+' — '+r.customer_name),element('p',new Date(r.created_at).toLocaleString()+' · '+r.category.toUpperCase()),element('p','Email: '+r.customer_email),element('p','Size: '+(r.size||'Not specified')+' · Colors: '+(r.colors||'Not specified')+' · Quantity: '+(r.quantity||'Not specified')),element('p',r.details));for(const f of r.files||[]){const button=element('button','OPEN ARTWORK: '+f.name);button.className='btn';button.onclick=async()=>{button.disabled=true;try{const d=await call({action:'artwork',path:f.path});window.open(d.url,'_blank','noopener,noreferrer')}catch(e){alert(e.message)}finally{button.disabled=false}};box.append(button)}root.append(box)}}catch(e){status.textContent=e.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
